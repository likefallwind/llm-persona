   <g id="text_1">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203544" x="426.24" y="33.388384" transform="rotate(-0 426.24 33.388384)">Study design: separate problems, predictions saved before response collection</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203544" x="147.5784" y="84.827964" transform="rotate(-0 147.5784 84.827964)">Training answers</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(35.922853 114.052304)">32 questions / 30 source families</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(39.428634 133.627304)">Four subjects / standard prompt</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(41.062345 153.202304)">5 models · 4 states · 2 requests</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(98.213752 173.277226)">1,280 answers</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203544" x="426.24" y="84.827964" transform="rotate(-0 426.24 84.827964)">Fix predictions</text>
   </g>
   <g id="text_5">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(319.058437 114.052304)">Fit and tune on training sources</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(308.489414 133.627304)">Save predictions and fitted models</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(302.172891 153.202304)">Primary tests and robustness checks</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(324.335039 172.777304)">Before collecting test answers</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203544" x="704.9016" y="84.826714" transform="rotate(-0 704.9016 84.826714)">Test answers</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(611.275936 114.052304)">32 separate source families</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(592.426561 133.627304)">Same subjects / standard prompt</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(598.385545 153.202304)">5 models · 4 states · 2 requests</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(655.536952 173.277226)">1,280 answers</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203544" x="426.24" y="234.49291" transform="rotate(-0 426.24 234.49291)">Three research questions tested on the new responses</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203544" x="147.5784" y="286.105404" transform="rotate(-0 147.5784 286.105404)">RQ1 · Recurring behavior</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(42.83633 315.329744)">Repeat agreement and profiles</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(27.68258 334.904744)">Two requests under identical inputs</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(23.90258 354.479744)">Report how often each action occurs</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(69.803634 375.362557)">32 new source families</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203544" x="426.24" y="286.105404" transform="rotate(-0 426.24 286.105404)">RQ2 · Behavior prediction</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(347.814492 315.329744)">Four nested predictors:</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(317.605078 334.904744)">subject + state; model defaults;</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(318.32543 354.479744)">model × subject; model × state</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(334.713164 374.054744)">Losses averaged by source</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203544" x="704.9016" y="286.105404" transform="rotate(-0 704.9016 286.105404)">RQ3 · Instruction effects</text>
   </g>
   <g id="text_14">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(611.292811 316.637557)">16 matched source families</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(581.262694 335.523846)">Standard; neutral A/B; ASK; EXPLAIN</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(597.789647 354.479744)">All student states; two requests</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; fill: #263b48" transform="translate(619.868475 374.673846)">2,560 additional answers</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #526674" x="426.24" y="417.426119" transform="rotate(-0 426.24 417.426119)">Additional checks: 160 complete/missing-information answers + 40 reference-question replies.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #526674" x="426.24" y="438.659783" transform="rotate(-0 426.24 438.659783)">All counts describe the fixed design. Repeated requests and prompt variants do not add independent sources.</text>
   </g>
  </g>
 </g>
