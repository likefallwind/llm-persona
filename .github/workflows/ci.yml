name: research-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frozen-artifact-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Install PDF audit tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check Python and shell syntax
        run: |
          python -m py_compile scripts/*.py
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Test frozen submission decisions
        run: python -m pytest -q tests
      - name: Verify registered headline claims
        run: >-
          python scripts/verify_release_claims.py
          --root .
          --output-dir /tmp/claim-verification
      - name: Audit public artifact structure
        run: >-
          python scripts/audit_release_privacy.py
          --root .
          --output /tmp/release-privacy-audit.md
      - name: Audit anonymous ACL PDF
        run: >-
          python scripts/audit_acl_submission.py
          --root .
          --output-dir /tmp/submission-audit
          --require-pass
      - name: Rebuild the publication overview figure
        run: >-
          python scripts/make_paper_figures.py
          --root .
          --output-dir /tmp/paper-figures
      - name: Confirm checks did not mutate the checkout
        run: git diff --exit-code
